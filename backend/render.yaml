services:
  - type: web
    name: bible-library-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
    startCommand: |
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bible-library-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: bible-library-api.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://jeevan953.github.io,http://localhost:5173,http://localhost:3000

  - type: redis
    name: bible-library-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
